input:
  vhdr: /path/to/fastr_gradient_corrected.vhdr

output:
  vhdr: /path/to/fastr_bcg_corrected.vhdr

correction:
  method: aas
  window_seconds: [-0.2, 0.7]
  # Recorded in provenance as the configured reference. Correction estimates
  # the applied ECG-to-BCG delay from the FASTR EEG and independent R train.
  ecg_to_bcg_delay_seconds: 0.210
  aas_neighbor_count: 20
  # Historical within-cohort sweep: variable alpha removal increased at 3/4
  # components. That diagnostic cannot identify neural loss; choice is exploratory.
  pca_obs_components: 2
  # Fixed exploratory resolutions from the 2026-09-02 cancellation audit, not
  # an optimized winner-selection scale. Eight beats is a minimum support rule,
  # not a validated noise cutoff. Unsupported scales are explicitly unavailable.
  # Residuals are diagnostic only; no calibrated acceptance threshold exists.
  evaluation:
    block_counts: [2, 5, 10, 20]
    minimum_beats_per_block: 8
  # No template is subtracted where no beat was detected, so an RR gap leaves
  # full-amplitude BCG in a bounded span. Those spans are written to the output
  # as "Bad Interval" markers for downstream rejection; above this share of the
  # recording the detected beats cannot be trusted either, so the recording is
  # refused. 0.05 sits at the cohort's p95 gap burden.
  maximum_gap_fraction: 0.05

detector:
  ecg_channel: ECG
  preprocessing_band_hz: [0.5, 10.0]
  teager_emphasis_hz: 10.0
  teager_smoothing_seconds: 0.028
  template_window_seconds: [-0.2, 0.4]
  minimum_rr_seconds: 0.4
  maximum_rr_seconds: 2.0
  candidate_refractory_seconds: 0.25
  candidate_prominence_mad: 2.0
  correlation_threshold: 0.5
  refinement_iterations: 2

# Template: overlay FASTR vs AAS vs PCA-OBS vs BCGNet.
# Copy to the repository root as compare.yaml and set the paths.
#
# Keep the run flags false unless you want `bcg compare` to generate an arm
# first (same code paths as `bcg aas` / `bcg pca-obs` / `bcg blocked-mean`).

paths:
  fastr_root: /path/to/fastr_python
  # AAS writes *_fastr_aas.vhdr here.
  aas_root: /path/to/fastr_python_bcg
  # PCA-OBS writes *_fastr_pcaobs.vhdr here.
  pca_obs_root: /path/to/fastr_python_pcaobs
  blocked_mean_root: /path/to/fastr_python_blockedmean
  bcgnet_root: /path/to/fastr_python_bcgnet
  output_root: /path/to/bcg_compare
  # Generated method-vs-method pages; relative to this config's folder.
  experiments_root: /path/to/comparison_figures

# Recordings are corrected independently, so this is simply how many run at
# once. Four matches this machine's performance cores; each worker holds one
# 1 kHz recording in memory, so raise it against RAM, not core count.
compute:
  workers: 4

run:
  aas: false
  pca_obs: false
  blocked_mean: false
  bcgnet: false

# Used only when run.bcgnet is true. A relative path resolves against the
# folder holding this file.
bcgnet_config: config.yaml

# Shared by every bounded arm: one detector, one window, one delay, so
# the bounded methods differ only in how they build the artifact estimate.
correction:
  window_seconds: [-0.2, 0.7]
  ecg_to_bcg_delay_seconds: 0.210
  aas_neighbor_count: 20
  # Two, not the MNE default of four. Swept on this cohort (n=42): components
  # 3 and 4 removed no additional artifact -- 1-4 Hz phase-locked removal was
  # flat at 18.3 / 18.5 / 18.3 for 2 / 3 / 4 -- while alpha taken as collateral
  # climbed 18.7% -> 26.6% -> 33.1%. Every component past the second was pure
  # signal loss, and n=2 beat n=3 on alpha in 42 of 42 recordings.
  pca_obs_components: 2
  # Contiguous held-out blocks for the blocked-mean arm: each beat is
  # corrected by the mean of the beats outside its own block (plus that
  # block's ECG projection of the beat's own ECG), so nothing subtracted from
  # a beat's EEG was estimated from that beat.
  cross_fit_fold_count: 10
  # Calibrated at 1000 Hz: the ratio rises with sampling rate, so recalibrate
  # rather than reuse this number at another rate.
  maximum_residual_ratio: 0.5
  # The ratio above is scale-free, so a recording that began with little
  # heartbeat-locked energy cannot halve it however well the correction ran.
  # Below this absolute locked residual the ratio stops gating output. 5 uV is
  # under the p10 of *raw* locked amplitude across recordings that pass.
  residual_floor_uv: 5.0
  # No template is subtracted where no beat was detected, so an RR gap leaves
  # full-amplitude BCG in a bounded span. Those spans are written to the output
  # as "Bad Interval" markers for downstream rejection; above this share of the
  # recording the detected beats cannot be trusted either, so the recording is
  # refused. 0.05 sits at the cohort's p95 gap burden.
  maximum_gap_fraction: 0.05
  overwrite: false
  detector:
    ecg_channel: ECG
    preprocessing_band_hz: [0.5, 10.0]
    teager_emphasis_hz: 10.0
    teager_smoothing_seconds: 0.028
    template_window_seconds: [-0.2, 0.4]
    minimum_rr_seconds: 0.4
    maximum_rr_seconds: 2.0
    candidate_refractory_seconds: 0.25
    candidate_prominence_mad: 2.0
    correlation_threshold: 0.5
    refinement_iterations: 2

plot:
  channel: Cz
  epoch_start_seconds: 10
  epoch_seconds: 3
  psd_max_hz: 100

subjects:
  include: []
  exclude: []

# Optional. How run numbers are read out of recording filenames. The default
# matches run1, run_2, run-02, RUN.3 and does not match "run" inside a longer
# word. A recording whose name has no run token -- a baseline, say -- is still
# trained on and still cleaned; it is simply not counted or plotted as a run,
# and it is named after its own filename instead.
# naming:
#   run_pattern: 'run[ _.-]?(\d+)'

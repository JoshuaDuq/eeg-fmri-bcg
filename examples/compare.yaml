# Compare FASTR (gradient-corrected) vs AAS vs BCGNet.
# run.aas / run.bcgnet false = use the folders as already processed.

paths:
  fastr_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python
  aas_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_bcg_gapfix
  bcgnet_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/bcgnet_trial/cleaned_data
  output_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/bcg_compare

run:
  aas: false
  bcgnet: false

# Used only when run.bcgnet is true.
bcgnet_config: config.yaml

aas:
  method: aas
  window_seconds: [-0.2, 0.7]
  ecg_to_bcg_delay_seconds: 0.210
  aas_neighbor_count: 20
  pca_obs_components: 4
  maximum_residual_ratio: 0.5
  overwrite: false
  detector:
    ecg_channel: ECG
    preprocessing_band_hz: [0.5, 10.0]
    teager_emphasis_hz: 10.0
    teager_smoothing_seconds: 0.028
    template_window_seconds: [-0.2, 0.4]
    minimum_rr_seconds: 0.4
    maximum_rr_seconds: 2.0
    candidate_refractory_seconds: 0.25
    candidate_prominence_mad: 2.0
    correlation_threshold: 0.5
    refinement_iterations: 2

plot:
  channel: Cz
  epoch_start_seconds: 10
  epoch_seconds: 3
  psd_max_hz: 30

subjects:
  include: []
  exclude: []

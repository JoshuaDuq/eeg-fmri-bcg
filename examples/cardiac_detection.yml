input:
  vhdr: /data/fastr_gradient_corrected/recording.vhdr

output:
  vhdr: /data/fastr_with_independent_pulse_markers/recording.vhdr

detector:
  ecg_channel: ECG
  # The corrected ECG in this study has a broad cardiac waveform. This low-frequency
  # morphology band is locked for the study benchmark and must be validated on the
  # target cohort before interpretation.
  preprocessing_band_hz: [0.5, 10.0]
  teager_emphasis_hz: 10.0
  teager_smoothing_seconds: 0.028
  template_window_seconds: [-0.2, 0.4]
  minimum_rr_seconds: 0.4
  maximum_rr_seconds: 2.0
  candidate_refractory_seconds: 0.25
  candidate_prominence_mad: 2.0
  correlation_threshold: 0.5
  refinement_iterations: 2

# Template: BCGNet training.
# Copy to the repository root as config.yaml and set the paths.
# Comparison against AAS and PCA-OBS is examples/compare.yaml.

paths:
  fastr_root: /path/to/fastr_python
  output_root: /path/to/fastr_python_bcgnet

compute:
  workers: 2
  cpu_count: 10
  threads_per_worker: auto

training:
  # Cap is the paper YAML (2500). Early stopping decides. Keep batch 16.
  num_epochs: 2500
  es_patience: 25
  batch_size: 16
  learning_rate: 0.001
  random_seed: 1997
  architecture: default_rnn_model
  overwrite: true
  resume: true
  save_model: true
  save_data: true
  save_figures: true

preprocess:
  new_fs: 100
  len_epoch: 3
  mad_threshold: 5
  per_training: 0.7
  per_valid: 0.15
  per_test: 0.15
  ecg_channel: ECG

subjects:
  include: []
  exclude: []

# Optional. How run numbers are read out of recording filenames. The default
# matches run1, run_2, run-02, RUN.3 and does not match "run" inside a longer
# word. A recording whose name has no run token -- a baseline, say -- is still
# trained on and still cleaned; it is simply not counted or plotted as a run,
# and it is named after its own filename instead.
# naming:
#   run_pattern: 'run[ _.-]?(\d+)'

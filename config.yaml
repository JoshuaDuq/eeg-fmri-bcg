# BCGNet cohort configuration.
# Copy this file, edit paths and compute settings, then:
#   bcgnet discover --config config.yaml
#   bcgnet run --config config.yaml

paths:
  # Gradient-corrected EEG (BCG still present).
  fastr_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python
  output_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_bcgnet

compute:
  # Two subject workers share this machine's 10 cores.
  workers: 2
  cpu_count: 10
  # "auto" sets threads_per_worker = cpu_count // workers
  threads_per_worker: auto

training:
  # Cap is the paper YAML (2500). Early stopping decides. Keep batch 16.
  num_epochs: 2500
  es_patience: 25
  batch_size: 16
  learning_rate: 0.001
  random_seed: 1997
  architecture: default_rnn_model
  overwrite: true
  resume: true
  save_model: true
  save_data: true
  save_figures: true

preprocess:
  new_fs: 100
  len_epoch: 3
  mad_threshold: 5
  per_training: 0.7
  per_valid: 0.15
  per_test: 0.15
  ecg_channel: ECG

subjects:
  # Empty include list means every sub-* folder under fastr_root.
  include: []
  exclude: []

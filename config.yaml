# BCGNet training configuration.
# This is the live config for this study; examples/config.yaml is the
# template. Comparison against AAS and PCA-OBS is compare.yaml.
#   bcgnet discover --config config.yaml
#   bcgnet run --config config.yaml

paths:
  # Gradient-corrected EEG (BCG still present).
  fastr_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python
  output_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_bcgnet

compute:
  # Two subject workers share this machine's 10 cores.
  workers: 2
  cpu_count: 10
  # "auto" sets threads_per_worker = cpu_count // workers
  threads_per_worker: auto
  # Optional. "cpu" (default), "gpu", or "gpu:<index>" to pick a card on a
  # multi-GPU host. A gpu run fails immediately if TensorFlow sees no card,
  # rather than training for hours on the CPU by accident. On Windows that
  # needs WSL2 with tensorflow[and-cuda] -- TensorFlow has shipped no
  # native-Windows GPU build since 2.10.
  device: cpu

training:
  # Cap is the paper YAML (2500). Early stopping decides. Keep batch 16.
  num_epochs: 2500
  es_patience: 25
  batch_size: 16
  learning_rate: 0.001
  random_seed: 1997
  architecture: default_rnn_model
  overwrite: true
  resume: true
  save_model: true
  save_data: true
  save_figures: true

preprocess:
  new_fs: 100
  len_epoch: 3
  mad_threshold: 5
  per_training: 0.7
  per_valid: 0.15
  per_test: 0.15
  ecg_channel: ECG

subjects:
  # Empty include list means every sub-* folder under fastr_root.
  include: []
  exclude: []

# Optional. How run numbers are read out of recording filenames. The default
# matches run1, run_2, run-02, RUN.3 and does not match "run" inside a longer
# word. A recording whose name has no run token -- a baseline, say -- is still
# trained on and still cleaned; it is simply not counted or plotted as a run,
# and it is named after its own filename instead.
# naming:
#   run_pattern: 'run[ _.-]?(\d+)'

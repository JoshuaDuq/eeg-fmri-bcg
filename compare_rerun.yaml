paths:
  fastr_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_v2
  aas_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_v3_bcg
  pca_obs_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_v3_pcaobs
  blocked_mean_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_v3_blockedmean
  bcgnet_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_v2_bcgnet
  output_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/bcg_compare_v3
  experiments_root: experiments_v3
compute:
  workers: 6
run:
  aas: false
  pca_obs: false
  blocked_mean: false
  bcgnet: false
bcgnet_config: config.yaml
correction:
  window_seconds:
  - -0.2
  - 0.7
  ecg_to_bcg_delay_seconds: 0.21
  aas_neighbor_count: 20
  pca_obs_components: 2
  cross_fit_fold_count: 10
  maximum_residual_ratio: 0.5
  residual_floor_uv: 5.0
  maximum_gap_fraction: 0.05
  overwrite: false
  detector:
    ecg_channel: ECG
    preprocessing_band_hz:
    - 0.5
    - 10.0
    teager_emphasis_hz: 10.0
    teager_smoothing_seconds: 0.028
    template_window_seconds:
    - -0.2
    - 0.4
    minimum_rr_seconds: 0.4
    maximum_rr_seconds: 2.0
    candidate_refractory_seconds: 0.25
    candidate_prominence_mad: 2.0
    correlation_threshold: 0.5
    refinement_iterations: 2
plot:
  channel: Cz
  epoch_start_seconds: 10
  epoch_seconds: 3
  psd_max_hz: 100
subjects:
  include: []
  exclude: []

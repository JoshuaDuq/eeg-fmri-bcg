# Study comparison configuration: FASTR vs AAS vs PCA-OBS vs BCGNet.
# This is the live config for this study; examples/compare.yaml is the template.
#   bcgnet aas      --config compare.yaml
#   bcgnet pca-obs  --config compare.yaml
#   bcgnet compare  --config compare.yaml
#
# Keep the run flags false unless you want `bcgnet compare` to generate an arm
# first (same code paths as the standalone commands above).

paths:
  fastr_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python
  # AAS keeps the historical *_fastr_bcg.vhdr name in this folder.
  aas_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_bcg_gapfix
  # PCA-OBS writes *_fastr_pcaobs.vhdr, so the two arms never overwrite.
  pca_obs_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_pcaobs
  bcgnet_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_bcgnet
  output_root: /Volumes/KINGSTON/EEG_fMRI_data/source_data/bcg_compare_v2

# Recordings are corrected independently, so this is simply how many run at
# once. Four matches this machine's performance cores; each worker holds one
# 1 kHz recording in memory, so raise it against RAM, not core count.
compute:
  workers: 4

run:
  aas: false
  pca_obs: false
  bcgnet: false

# Used only when run.bcgnet is true. A relative path resolves against the
# folder holding this file, so this refers to ./config.yaml.
bcgnet_config: config.yaml

# Shared by the aas and pca_obs arms: one detector, one window, one delay, so
# the two bounded methods differ only in how they build the artifact estimate.
correction:
  window_seconds: [-0.2, 0.7]
  ecg_to_bcg_delay_seconds: 0.210
  aas_neighbor_count: 20
  pca_obs_components: 4
  maximum_residual_ratio: 0.5
  overwrite: false
  detector:
    ecg_channel: ECG
    preprocessing_band_hz: [0.5, 10.0]
    teager_emphasis_hz: 10.0
    teager_smoothing_seconds: 0.028
    template_window_seconds: [-0.2, 0.4]
    minimum_rr_seconds: 0.4
    maximum_rr_seconds: 2.0
    candidate_refractory_seconds: 0.25
    candidate_prominence_mad: 2.0
    correlation_threshold: 0.5
    refinement_iterations: 2

plot:
  channel: Cz
  epoch_start_seconds: 10
  epoch_seconds: 3
  psd_max_hz: 100

subjects:
  include: []
  exclude: []
